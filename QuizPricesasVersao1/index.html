<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Quiz das Princesas</title>
</head>
<body>
    <div class="homebar">
        <h1 class="title1">💫🌈 Vamos ver qual princesa você seria? 💫🌈</h1>
    </div>

    <div>
        <img class="imgcapa" src="./img/Princesas-disney.jpg" alt="Quiz das princesas">
    </div>

    <div style="text-align:center; margin: 16px 0;">
        <input id="nomeJogador" type="text" maxlength="100" placeholder="Digite seu nome (opcional)"
               style="font-size:18px; padding:10px 16px; border-radius:30px; border:3px solid #ff66c4; text-align:center;">
    </div>

    <button class="botaoInicial" onclick="comecar()">JOGAR!</button>

    <script>
        function comecar() {
            sessionStorage.removeItem('quizPontos');
            sessionStorage.removeItem('quizSalvo');
            sessionStorage.setItem('quizNome', document.getElementById('nomeJogador').value.trim());
            location.href = './paginas/pag1.html';
        }
    </script>
</body>
</html>
