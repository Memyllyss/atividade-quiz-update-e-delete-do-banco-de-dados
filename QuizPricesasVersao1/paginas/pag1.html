<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style-perguntas.css">
    <title>Pergunta 1</title>
</head>
<body>

    <h2 class="titulo-pergunta">💗 Pergunta 1 de 8 — Qual é a sua cor favorita?</h2>

    <div class="quiz-container">
        <section>
            <!-- Azul → Elsa / Cinderela -->
            <button class="pergunta" data-pontos='{"elsa":1,"cinderela":1}' onclick="responder(this)">💙 Azul</button>
            <!-- Rosa → Rapunzel / Ariel -->
            <button class="pergunta" data-pontos='{"rapunzel":1,"ariel":1}' onclick="responder(this)">🩷 Rosa</button>
            <!-- Amarelo → Tiana / Rapunzel -->
            <button class="pergunta" data-pontos='{"tiana":1,"rapunzel":1}' onclick="responder(this)">💛 Amarelo</button>
            <!-- Vermelho → Mérida -->
            <button class="pergunta" data-pontos='{"merida":1}' onclick="responder(this)">❤️ Vermelho</button>
            <!-- Roxo → Moana -->
            <button class="pergunta" data-pontos='{"moana":1}' onclick="responder(this)">💜 Roxo</button>
        </section>

        <aside>
            <img class="imagemfofa" src="../img/pag1.jpg" alt="Quiz das princesas">
        </aside>
    </div>

    <script src="../js/quiz.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
