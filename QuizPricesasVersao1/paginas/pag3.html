<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style-perguntas.css">
    <title>Pergunta 3</title>
</head>
<body>

    <h2 class="titulo-pergunta">💗 Pergunta 3 de 8 — Qual princesa você se identifica mais?</h2>

    <div class="quiz-container">
        <section>
            <button class="pergunta" data-pontos='{"elsa":1}' onclick="responder(this)">❄️ Elsa</button>
            <button class="pergunta" data-pontos='{"moana":1}' onclick="responder(this)">🌊 Moana</button>
            <button class="pergunta" data-pontos='{"tiana":1}' onclick="responder(this)">🌟 Tiana</button>
            <!-- Mérida recebe +2 nesta pergunta -->
            <button class="pergunta" data-pontos='{"merida":2}' onclick="responder(this)">🏹 Mérida ⭐</button>
            <button class="pergunta" data-pontos='{"rapunzel":1}' onclick="responder(this)">☀️ Rapunzel</button>
            <button class="pergunta" data-pontos='{"ariel":1}' onclick="responder(this)">🐠 Ariel</button>
        </section>

        <aside>
            <img class="imagemfofa" src="../img/pag3.jpg" alt="Quiz das princesas">
        </aside>
    </div>

    <script src="../js/quiz.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
